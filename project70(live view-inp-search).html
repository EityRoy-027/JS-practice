<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="project70.css">
<body>
 <div id="main">
    <div id="sub">
        <div id="form">
            <div id="aplih">
                <h1>Aplication Form</h1>
            </div>

            <div id="slider">
                <div id="slide"></div>
            </div>

            <div id="inputs">
                <input id="name" placeholder="Full Name" type="text">
                <select name="sel" id="selrole">
                    <option id="op1" value="op1">Select Role</option>
                    <option id="dev" value="Developer">Developer</option>
                    <option id="des" value="Designer">Designer</option>
                    <option value="Cleaner">Cleaner</option>
                </select>
                <div id="inskill">
                    <input id="skill" placeholder="Skill" type="text">
                </div>
                <div id="experience">
                    <input id="inexp" placeholder="Experience" type="text">
                </div>
            </div>

            <div id="buttons">
                <button id="prev">previous</button>
                <button id="next">Next</button>
            </div>
        </div>

        <div id="preview">
            <div id="hpre"><h1>Live Preview</h1></div>

            <div id="ppre">
            <p id="np">Name:-</p>
            <p id="rp">Role:-</p>
            <p id="sp">Skill:-</p>
            <p id="exp">Experience:-</p>
            </div>
        </div>
    </div>
 </div>  
    


<script src="project70.js"></script>    
</body>
</html>
