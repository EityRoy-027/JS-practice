<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="project61.css">
<body>
<div id="main">
      
    <div id="sub">
        <div id="divh">
            <h1>Advanced Task Board</h1>
        </div>
      
        <div id="inputs">
            <div id="in">
                <input id="inpu" placeholder="Task title" type="text">
            </div>
            <div id="sel">
                <select name="s" id="s">
                    <option value="high">High

                  </option>
                   <option value="medium">Medium

                  </option>
                   <option value="low">Low

                  </option>
                </select>
            </div>
            <div id="buttons">
                <button>Add Task</button>
            </div>
        </div>

        <div id="outputs">
            <div id="do">
                <p>To Do</p>
                
            </div>
            <div id="pro">
                <p>In Progress</p>
                <div id="prog">
                    <div id="gress">

                    </div>
                </div>
               
            </div>
             
            <div id="com">
                <p>Completed</p>
                   <div id="comp">
                    <div id="comple">

                    </div>
                </div>
                
            </div>
         
        </div>
    </div>
</div> 
    
<script src="project61.js"></script>    
</body>
</html>
