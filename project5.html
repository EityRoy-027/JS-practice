<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="project5.css">
</head>
<body>
 <div id="calbody">

    <div id="screen"></div>
    <div id="buttons">
    
        <div id="firstrow">
            <button id="seven">7</button>
             <button id="eight">8</button>
              <button id="nine">9</button>
               <button id="plus" style="background-color:darkseagreen;">+</button>
        </div>

        <div id="secondrow">
            <button id="four">4</button>
             <button id="five">5</button>
              <button id="six">6</button>
               <button id="minus" style="background-color:darkseagreen;">-</button>
        </div>

        <div id="thirdrow">
            <button id="one">1</button>
             <button id="two">2</button>
              <button id="three">3</button>
               <button id="multiply" style="background-color:darkseagreen;">x</button>
        </div>

        <div id="fourthrow">
            <button id="c" style="background-color:rgb(232, 54, 90);">C</button>
             <button id="zero">0</button>
              <button id="equal">=</button>
               <button id="slash" style="background-color:darkseagreen;">/</button>
        </div>


    </div>
 </div>   
<script src="project5.js"></script>    
</body>
</html>
