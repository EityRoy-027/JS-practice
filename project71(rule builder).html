<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="project71.css">
<body>
 <div id="main">
    <div id="firsth">
            <h1>Predefined Rule Builder</h1></div>
    <div id="sub">

        <div id="con">
            <h1 id="conh">Conditions</h1>
            <div class="condition" id="score" draggable="true">Score>80</div>

            <div class="condition" id="attend" draggable="true"><p id="atp">Attendance=</p>
            <p id="prep">Present</p>
           </div>

            <div class="condition" id="payment" draggable="true">
                <p id="payp">Payment</p>
                <p id="comp">Completed</p>
            </div>

            <div id="ach">
                <h1>Actions</h1>
            </div>
            <div class="condition" id="unlock" draggable="true">Unlock Courses</div>

            <div class="condition" id="email" draggable="true">Send Email</div>
            
            <div class="condition" id="certi" draggable="true">Show Certificate</div>
        </div>

        <div id="drop">
            <div id="hdrop">
                <p id="pdrop">Drop conditions first, then actions</p>
                <div id="emptydrop"></div>
            </div>
        </div>

        <div id="preview">
            <div id="ruleh">
                <h1>Rule Preview</h1>
            </div>

            <div id="no">No Rule</div>
            <div id="butrun">
                <button id="run">Run Role</button>
                <div id="emptyrule"></div>
            </div>
        </div>
    </div>
 </div>
    


<script src="project71.js"></script>    
</body>
</html>
