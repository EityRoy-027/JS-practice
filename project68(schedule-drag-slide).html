<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="project68.css">
<body>
 <div id="main">
    <div id="sub">
        <div id="task">
            <p id="taskp">Tasks</p>
            <div class="tasks" id="design" draggable="true">Design(1h)
                <div id="designslider">
                    <div id="designslide"></div>
                </div>
            </div> 

            <div class="tasks" id="code" draggable="true">Coding(2h)
                <div id="codslider">
                    <div id="codslide"></div>
                </div>
            </div>

            <div class="tasks" id="meet" draggable="true">Meeting(1.5h)
                <div id="meetslider">
                    <div id="meetslide"></div>
                </div>
            </div>

            <div class="tasks" id="test" draggable="true">Testing(3h)
                <div id="testslider">
                    <div id="testslide"></div>
                </div>
            </div>
        </div>

        <div id="schedule">
            <p id="schedup">Schedule</p>
            <div class="time" id="morn"><p id="mop">Morning</p>
            <p id="mop2"><span id="spinm">0</span>/480 min
            </p></div>

            <div class="time" id="after"><p id="afp">Afternoon</p>
            <p id="afp2"><span id="spina">0</span>/480 min
            </p></div>

            <div class="time" id="even"><p id="evp">Evening</p>
            <p id="evp2"><span id="spine">0</span>/480 min
            </p></div>

            
        </div>
    </div>
 </div> 
    


<script src="project68.js"></script>    
</body>
</html>
