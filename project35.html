<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<link rel="stylesheet" href="project35.css">
<body>
<div id="main">
    <div id="sub">
        <div id="divh">
            <h1>Text Style Controller</h1>
        </div>
        <div id="slider">
            <div id="font">
            <p style="font-size: 15px;">Fontsize</p>
            <input type="range" min="8" max="32" value="8"  id="fontin">
            </div>

            <div id="opa">
            <p style="font-size: 15px;">Opacity</p>
            <input type="range" min="0.1" max="1" value="8" step="0.1" id="opain">
            </div>
        </div>
        <div id="text">
      <p id="para">This is a live text controller, Adjust the slide to see change in fontsize and opacity.</p>
        </div>
    </div>
</div>
 <script src="project35.js"></script>   
</body>
</html>
